revision: 2026-10-30-rules-v1
registry: infra/registry.yaml
doc: docs/reference/infrastructure.md

# Machine-readable правила обращения с инфраструктурой.
# Каждый id обязан присутствовать в docs/reference/infrastructure.md, и наоборот.
# Проверка: tools/contracts/check_infra.py

rules:
  - id: RULE-001
    obligation: MUST
    statement: >-
      Новый сервис разворачивается вместе с мониторингом в Grafana (health и
      ключевые метрики) до того, как задача считается выполненной. Установка без
      мониторинга не считается установкой.
    verification: >-
      В infra/registry.yaml у записи заполнено поле monitoring; дашборд или
      правило алерта существует и отвечает в Grafana.

  - id: RULE-002
    obligation: MUST_NOT
    statement: >-
      Не писать локальные скрипты и ad-hoc замеры для того, что уже наблюдается
      в Grafana или Langfuse. Сначала искать существующую панель, метрику или
      трейс.
    verification: >-
      В issue приложена ссылка на дашборд или трейс, а не дамп самописного
      скрипта.

  - id: RULE-003
    obligation: MUST
    statement: >-
      Инфраструктурный факт описывается один раз. Единственный источник —
      infra/registry.yaml; документы, скиллы и issue ссылаются на id записи, а
      не пересказывают адрес или путь.
    verification: >-
      grep по адресам и путям из реестра не находит их повторения в других
      файлах репозитория, кроме ссылок на id.

  - id: RULE-004
    obligation: MUST_NOT
    statement: >-
      Секреты (пароли, токены, приватные ключи, содержимое .env) не попадают ни
      в реестр, ни в репозиторий. Вместо секрета указывается место его хранения.
    verification: >-
      tools/contracts/check_infra.py сканирует реестр на известные префиксы
      ключей и на поля api_key/password/token с непустым литеральным значением.

  - id: RULE-005
    obligation: MUST
    statement: >-
      Проверка того, что алерт дошёл до человека, выполняется через Pipedream
      Gmail (gmail_find_email), а не через Grafana API: токен не имеет прав
      alert.notifications.* и отвечает 403. Отсутствие письма — отдельный факт,
      который устанавливают, а не предполагают.
    verification: >-
      В issue или отчёте приведён факт из почты: отправитель, тема и время
      письма, либо явное UNKNOWN, если доступа к ящику нет.

  - id: RULE-006
    obligation: MUST_NOT
    statement: >-
      Правило алерта не должно закрываться раньше, чем человек успевает его
      увидеть. Ночной отказ не может превращаться в утренний RESOLVED: окно
      наблюдения шире интервала повтора, иначе инцидент маскирует сам себя.
    verification: >-
      У правил категории backup окно наблюдения не меньше интервала повтора,
      keep_firing_for перекрывает ночь, а в описании правила записано, почему
      выбран такой интервал.

  - id: RULE-007
    obligation: MUST
    statement: >-
      У каждого MCP-сервера два маршрута: нативный клиент Hermes
      (mcp__<server>__<tool>) и внешний mcporter. Если нативный вызов отвечает
      Unknown tool при живом сервере, это устаревший каталог клиента, а не
      отсутствующая возможность: сравнить оба списка инструментов, назвать
      расхождение и не строить обходной workflow на мёртвых именах.
    verification: >-
      Расхождение подтверждено сравнением двух каталогов, и в отчёте назван
      маршрут, которым выполнена операция.

  - id: RULE-008
    obligation: MUST_NOT
    statement: >-
      Токен MCP-сервера не вводится вручную в командную строку и не копируется
      из конфига Hermes. Для внешнего маршрута запускается тот же launcher, что
      использует Hermes, чтобы секрет не попал ни в argv, ни в историю оболочки.
    verification: >-
      В команде нет литерального токена; используется --stdio с launcher'ом или
      env-файл, а в отчёте указано, откуда взят секрет (без его значения).

  - id: RULE-009
    obligation: MUST
    statement: >-
      Любое изменение продовой инфраструктуры — конфиг сервиса, лаунчер MCP,
      настройка банка памяти, compose-файл, правило алерта, скрипт отправки
      метрик — оформляется как issue ДО правки. Issue содержит пять вещей:
      мотивацию, что было и что стало, как откатить, как проверить, какие
      границы правка не меняет. Тестовые стенды и одноразовые инсталляции под
      это правило не попадают: там достаточно записать результат замера.
      Исключение — аварийный режим по RULE-013.
    verification: >-
      В issue присутствуют все пять разделов, правка ссылается на номер issue,
      после применения приложен readback (значение до и после, ответ API или
      версия файла).

  - id: RULE-010
    obligation: MUST_NOT
    statement: >-
      Issue не требуется для изменений, не меняющих поведение: комментарии,
      форматирование, переименование переменной внутри функции, обновление
      текста документа без смены смысла. Исключение не распространяется на
      default-значения, флаги и списки инструментов — они меняют поведение,
      даже когда выглядят как правка текста.
    verification: >-
      В диффе правки нет изменений значений по умолчанию, флагов, списков
      инструментов, путей и разрешений; либо такой issue существует.

  - id: RULE-011
    obligation: MUST
    statement: >-
      Изменение классифицируется по двум осям: среда (prod/test, RULE-009) и
      критичность. Классы: P1 — необратимое (потеря данных, памяти, доступа);
      P2 — восстановимое (ломается, но чинится за минуты); P3 — знание (текст
      без исполнения); T — тест (стенды, эксперименты, пилоты). Класс записан у
      сервиса в infra/registry.yaml полем criticality, а не выводится из папки.
      P1 блокирует merge до внешнего ревью: Codex-бот на head-коммите или
      Approve человека. P2 требует детерминированных проверок; субагент на
      бесплатной модели даёт консультацию — его находки идут в PR и не
      блокируют merge. P3 — self-review автора. T — только чекеры.
    verification: >-
      У затронутых сервисов в реестре заполнен criticality. Для P1 есть ревью
      от chatgpt-codex-connector или Approve. Для P2 зелёный tools/dev/check.
      Консультация субагента, если проводилась, приложена ссылкой и не является
      условием merge.

  - id: RULE-012
    obligation: MUST_NOT
    statement: >-
      Ревью на бесплатной модели не отменяется из-за того, что оно слабее:
      слабое ревью находит структурные и очевидные ошибки, а его отсутствие
      не находит ничего. Если модель ревьюера не справляется с задачей — это
      факт для issue, а не повод пропустить шаг.
    verification: >-
      В отчёте ревью названы модель и маршрут (Codex-бот или субагент), а не
      только факт «ревью проведено».

  - id: RULE-013
    obligation: MUST
    statement: >-
      В аварии правка инфраструктуры разрешена без issue, если сервис или
      трекер недоступны. Запись ведётся в локальный журнал на хосте
      (D:/theseus-ops/incidents.log) — вне репозитория, вне GitHub и вне Hermes:
      в момент аварии сеть и агент могут быть недоступны, а файл на диске нет.
      После восстановления issue создаётся в течение суток со ссылкой на запись.
    verification: >-
      В журнале есть запись со временем, сервисом, симптомом, действием и
      проверкой; в issue есть ссылка на эту запись; между ними не больше суток.

  - id: RULE-014
    obligation: MUST_NOT
    statement: >-
      Аварийный режим не становится обычным способом работы. Он включается
      наблюдаемым признаком (сервис не отвечает, трекер недоступен), а не
      словами «сейчас некогда». Гейт на merge в нём не отключается: авария
      чинится на хосте, а не слиянием в main.
    verification: >-
      В записи журнала назван конкретный отказ, а не субъективная срочность;
      число записей без последующего issue равно нулю.


