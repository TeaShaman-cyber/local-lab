name: gate

# Two checks, one verdict each. This replaced a single job that ran on both
# `pull_request` and `pull_request_review`: the first run failed for lack of a
# review, the second passed once the review arrived, and branch protection
# blocked on the worse of the two. Cancelling could not help — the first run
# had already finished before the second started.
#
#   gate-checks  deterministic checks. Always gives a verdict on the commit.
#   gate-review  outside review for P1. Waits for it instead of being re-run,
#                so there is exactly one run and one verdict per commit.
#
# A change is P1 by its class in infra/registry.yaml, resolved through
# tools/contracts/review_needed.py — not by folder name.
#
# merge-watch stays separate on purpose: it runs after the merge and detects a
# merge nobody asked for. Detection is not a gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate-checks:
    name: gate-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      need_review: ${{ steps.need.outputs.required }}
    steps:
      - name: Check out the pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$EXPECTED_SHA" ]; then
            printf 'GATE_SOURCE_MISMATCH expected=%s observed=%s\n' "$EXPECTED_SHA" "$checkout_sha" >&2
            exit 2
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # The same linters the local check uses, installed the same way. Without
      # this, STRICT=1 would fail on every run in CI, and without STRICT the gate
      # would silently skip linters that are missing — the failure mode RULE-016
      # exists to prevent.
      - name: Install linters
        run: |
          set -euo pipefail
          pip install --quiet ruff yamllint
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -sL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin actionlint
          shellcheck --version | head -2
          actionlint -version

      - name: Deterministic checks
        env:
          # A missing linter is a failure in CI. Locally the check may SKIP, and
          # says so out loud; here silence is not acceptable.
          STRICT: "1"
        run: bash tools/dev/check

      - name: Does this change need an outside review
        id: need
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE" "$HEAD" > changed.txt
          echo "--- changed ---"
          cat changed.txt
          set +e
          python tools/contracts/review_needed.py < changed.txt
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

  gate-review:
    name: gate-review
    needs: gate-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Not P1 — nothing to wait for
        if: needs.gate-checks.outputs.need_review != 'true'
        run: echo "Not P1 — no outside review required."

      - name: Wait for an outside review
        if: needs.gate-checks.outputs.need_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          head_date=$(gh api "repos/$REPO/commits/$HEAD" --jq '.commit.committer.date')
          echo "waiting for review of $HEAD (committed $head_date)"

          # A review lands in one of three shapes. All three are evidence that
          # someone outside looked at this exact commit:
          #   1. a review object pinned to the head commit;
          #   2. a thumbs-up reaction — Codex stays silent when it finds nothing;
          #   3. an APPROVED review from a human.
          # Waiting here instead of being re-run on the review event is what
          # keeps one verdict per commit.
          for attempt in $(seq 1 30); do
            bot=$(gh api "repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select((.user.login | startswith(\"chatgpt-codex-connector\")) and .commit_id == \"$HEAD\")] | length")
            if [ "$bot" -gt 0 ]; then
              echo "PASS: Codex reviewed $HEAD ($bot)"
              exit 0
            fi

            thumb=$(gh api "repos/$REPO/issues/$PR/reactions" --paginate \
              --jq "[.[] | select((.user.login | startswith(\"chatgpt-codex-connector\")) and .content == \"+1\" and .created_at > \"$head_date\")] | length")
            if [ "$thumb" -gt 0 ]; then
              echo "PASS: Codex reacted thumbs-up on this PR after $head_date — reviewed, no findings"
              exit 0
            fi

            human=$(gh api "repos/$REPO/pulls/$PR/reviews" \
              --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD\" and ((.user.login | startswith(\"chatgpt-codex-connector\")) | not))] | length")
            if [ "$human" -gt 0 ]; then
              echo "PASS: human approval on $HEAD ($human)"
              exit 0
            fi

            echo "attempt $attempt/30: no outside review yet, waiting 20s"
            sleep 20
          done

          echo "::error::P1 change without outside review on $HEAD after 10 minutes."
          echo "Ask for one: comment '@codex review', or approve in the GitHub UI."
          echo "Deterministic checks passed — this is the review requirement, not a code defect."
          echo "If the review arrives later, re-run: gh run rerun <run-id>"
          exit 1
