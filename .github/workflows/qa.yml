name: QA

# Canonical QA gate. The logic lives in tools/dev/check, so the same command
# runs locally and in CI. This file only checks out the PR head and calls it.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: local-lab-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: Repository-owned QA gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$EXPECTED_SHA" ]; then
            printf 'QA_SOURCE_MISMATCH expected=%s observed=%s\n' "$EXPECTED_SHA" "$checkout_sha" >&2
            exit 2
          fi
          printf 'verification_profile=local-lab-qa\nverification_source_sha=%s\n' "$checkout_sha"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run repository QA
        run: bash tools/dev/check
