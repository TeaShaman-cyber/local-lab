services:
  - id: INFRA-001
    name: hindsight
    role: долговременная память — провайдер Hermes и изолированные операционные банки
    status: active
    kind: docker-compose
    location:
      compose: C:/Users/s.poklad/Documents/Codex/2026-07-08/life-science-research-plugin-life-science-4/deploy/hindsight/docker-compose.yml
      runtime_root: D:/hindsight
      env_file: D:/hindsight/.env
      ports: [8888, 9999, 1455]
      containers: [hindsight-api]
      volumes: [theseus-hindsight-pg0-v2, theseus-hindsight-hf-cache, theseus-hindsight-chatgpt-auth]
    monitoring: Grafana Cloud — container_* метрики через docker-exporter (INFRA-004), логи через Alloy
    check: python tools/hindsight_api.py health
    notes: pg0 живёт в named volume, не в bind-mount — bind-вариант дал root-owned каталог, и postgres не инициализировался

  - id: INFRA-002
    name: hermes-subscription-proxy
    role: брокер OAuth-креденшелов Nous для Solar-маршрута Hindsight
    status: active
    kind: docker-compose
    location:
      compose: C:/Users/s.poklad/Documents/Codex/2026-07-08/life-science-research-plugin-life-science-4/deploy/hindsight/docker-compose.yml
      runtime_root: D:/hindsight
      env_file: D:/hindsight/.env
      containers: [hermes-proxy]
      published_ports: none
    monitoring: Grafana Cloud — container_* через docker-exporter (INFRA-004)
    check: docker ps --filter name=hermes-proxy
    notes: статического ключа нет ни в compose, ни в реестре; auth живёт в named volume theseus-hermes-proxy-data

  - id: INFRA-003
    name: docker-read-proxy
    role: узкий read-only маршрут к Docker API для наблюдателей
    status: active
    kind: standalone-compose
    location:
      compose: D:/theseus-observatory/docker-proxy-lattice
      containers: [theseus-docker-socket-proxy]
    monitoring: Grafana Cloud — container_* через docker-exporter (INFRA-004)
    check: docker ps --filter name=theseus-docker-socket-proxy
    notes: без прямого docker.sock и без privileged; наружу отдаёт только read-эндпоинты

  - id: INFRA-004
    name: docker-exporter
    role: метрики контейнеров в Grafana Cloud
    status: active
    kind: docker-compose
    location:
      compose: C:/Users/s.poklad/Documents/Codex/2026-07-08/life-science-research-plugin-life-science-4/deploy/docker-exporter/docker-compose.yml
      env_file: D:/theseus-monitoring/docker-exporter.env
      containers: [theseus-otel-docker]
      network: docker-proxy-lattice_default (external, принадлежит INFRA-003)
    monitoring: сам является источником метрик; remote_write в Grafana Cloud Prometheus (uid grafanacloud-prom)
    check: docker ps --filter name=theseus-otel-docker
    notes: otel-collector-contrib 0.163.2 с docker_stats receiver; cAdvisor пробовали первым и отвергли — под Docker Desktop он видит контейнеры, но не резолвит файловые слои и не отдаёт per-container метрики

  - id: INFRA-005
    name: ohmgraphite
    role: аппаратные датчики — реальная частота CPU, температуры по ядрам, package power
    status: active
    kind: windows-service
    location:
      install_path: C:/Apps/OhmGraphite
      config: C:/Apps/OhmGraphite/OhmGraphite.exe.config
      service: OhmGraphite
      endpoint: "127.0.0.1:4445/metrics"
    monitoring: Grafana Cloud — scrape через Alloy, затем remote_write
    check: sc query OhmGraphite
    notes: нужен потому, что windows_exporter отдаёт статическую номинальную частоту (1801 MHz), и троттлинг по нему не выводится

  - id: INFRA-006
    name: guardrails-test
    role: изолированный Hermes-профиль для проверки guardrails-плагина
    status: active
    kind: hermes-profile
    location:
      profile: guardrails-test
      bank: hermes-guardrails-test
    monitoring: Grafana Cloud и Langfuse — общие, отдельных панелей нет
    check: hermes --profile guardrails-test status
    notes: отдельный банк Hindsight; основной профиль не трогает

  - id: INFRA-007
    name: hermes-hugging-face-hub
    role: ограниченный справочный доступ к моделям и датасетам Hub
    status: active
    kind: mcp-integration
    location:
      endpoint: "https://huggingface.co/mcp"
      route: hermes-native-mcp -> official-hugging-face-mcp -> hub
    monitoring: Langfuse — трейсы вызовов MCP
    check: hf auth whoami
    notes: источник справки, не канон документации

  - id: INFRA-010
    name: digitalocean
    role: control plane облачного провайдера (только чтение)
    status: active-read-only-route-verified
    kind: provider
    location:
      iac_project: D:/theseus-infrastructure
      adapter: D:/theseus-infrastructure/scripts/digitalocean_mcp.py
      endpoints: [https://accounts.mcp.digitalocean.com/mcp, https://droplets.mcp.digitalocean.com/mcp]
    monitoring: Grafana Cloud — расходы в finops-панели; Langfuse — вызовы MCP
    check: mcporter list digitalocean
    notes: мутация только по явному разрешению; ни один ресурс не зарегистрирован, пока не создан и не прочитан обратно

  - id: INFRA-011
    name: pipedream-google-workspace
    role: Gmail, Google Calendar и Google Drive через Pipedream MCP
    status: active
    kind: mcp-integration
    location:
      server: mcp-pipedream
      tools:
        gmail: [gmail_send_email, gmail_create_draft, gmail_list_send_as_aliases]
        calendar: [google_calendar_create_event, google_calendar_get_event, google_calendar_respond_to_event]
        drive: [google_drive_upload_file, google_drive_move_file, google_drive_update_file, google_drive_list_files]
    monitoring: Langfuse — трейсы вызовов MCP
    check: live read-only call, e.g. google_drive_list_files with Max Results 1
    notes: единственный маршрут к Google-сервисам; Drive проверен read-only, вернул реальный файл

  - id: INFRA-012
    name: scheduled-metrics-push
    role: задачи Планировщика, отправляющие расходы и балансы провайдеров в Loki
    status: active
    kind: scheduled-tasks
    location:
      tasks:
        DeepInfra billing: E:/local-lab/tools/deepinfra_usage/push_deepinfra_usage.py
        Nous credits: E:/local-lab/tools/nous_usage/push_nous_usage.py
        Timeweb billing: E:/local-lab/tools/timeweb_usage/push_timeweb_usage.py
        FinOps session names: E:/local-lab/tools/finops/push_session_usage.py
        Hindsight LLM usage: E:/local-lab/tools/hindsight_usage/push_hindsight_llm_usage.py
        Provider Metrics: C:/Apps/theseus-metrics/provider-metrics-launcher.vbs
      prom_glob: C:/Apps/theseus-metrics/*.prom
    monitoring: Alloy читает C:/Apps/theseus-metrics/*.prom; Grafana Cloud — панели расходов
    check: python tools/deepinfra_usage/push_deepinfra_usage.py (ожидается loki=204)
    notes: скрипты берут Loki-креды из активного Alloy-конфига в Program Files, а не из .env

  - id: INFRA-013
    name: backup-lattice
    role: резервные копии операционного состояния
    status: active
    kind: scheduled-task
    location:
      task: Theseus Backup
      script: E:/local-lab/tools/backup_lattice/run_backup.py
      runtime_root: D:/theseus-backups
      repos: [local, s3, drive]
      heartbeat: "C:/Users/s.poklad/AppData/Local/hermes/logs/backup-lattice.log"
    monitoring: Grafana backup-guard — «нет успешного прогона 30 ч» и «прогон завершился ошибкой»; лог читает Alloy (job="backup")
    check: python tools/backup_lattice/run_backup.py; затем restic snapshots --latest 3 в каждом репозитории
    notes: ручной прогон 2026-10-30 11:03-11:37 успешен во всех трёх репозиториях, restore-drill sha256_match; плановый запуск 31.10 03:00 ещё не подтверждён — LastTaskResult на момент проверки был 1 от прогона до фикса

# Стенды для тестов и экспериментов. Порядок = приоритет: сначала LAB-001.
# Признак продового/тестового — RULE-009 в infrastructure.md.
test_stands:
  - id: LAB-001
    name: pve
    role: изолированные LXC и VM для экспериментов, которые влезают в память
    host: "pve.lab / 10.67.163.198 (host=pve-t490)"
    capacity: "7.48 GiB RAM, ThinkPad T490, без swap"
    constraints: >-
      Слабый CPU; одновременная загрузка моделей приводила к global OOM при
      свободной памяти хоста около 1.16 GiB. Требует, чтобы ноут был загружен в PVE
      (dual-boot с Windows). ICMP закрыт: ping не отвечает при живом сервере.
    priority: 1
    monitoring: "Grafana Cloud, job=integrations/unix, host=pve-t490; дашборд /d/pve-t490-host"
    check: "curl -sk https://10.67.163.198:8006/ (ожидается 200); ssh root@pve.lab 'pct list'"
    docs: docs/reference/pve.md
    notes: Предпочтителен по умолчанию. Продовую работу не затрагивает.

  - id: LAB-002
    name: local-docker
    role: контейнеры на основном ноутбуке, когда нужен запас памяти или быстрый диск
    host: "SPOKLAD, Docker Desktop VM"
    capacity: "VM 3.83 GiB, хост 31.8 GiB / i5-10210U (4 ядра, 8 потоков), D: 32 GiB свободно"
    constraints: >-
      Здесь же живут продовые сервисы: Hindsight (INFRA-001), docker-exporter
      (INFRA-004), socket-proxy (INFRA-003), бэкап. Тест не должен конкурировать
      за память, порты и диск.
    priority: 2
    monitoring: "Grafana Cloud — integrations/windows для хоста; контейнеры через docker-exporter (INFRA-004)"
    check: "docker info; docker ps"
    notes: >-
      Мощнее PVE, но близко к проду. Перед запуском проверить свободную память
      и что тест не публикует занятые порты.

  - id: LAB-003
    name: timeweb-cloud
    role: платное облако для того, что не влезает ни в PVE, ни в локальный Docker
    host: "Timeweb Cloud"
    capacity: по тарифу
    constraints: Платно. Брать только когда LAB-001 и LAB-002 показали, что не влезают.
    priority: 3
    monitoring: "Постоянного нет. При поднятии стенда — стандартная интеграция Grafana Cloud, иначе стенд не считается поднятым"
    check: read-only листинг через Timeweb API
    notes: Последний вариант, не по умолчанию.

