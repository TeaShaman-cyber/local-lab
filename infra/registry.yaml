    check: python tools/dev/skillpacks.py --emit-event
    notes: >-
      Автообновления нет намеренно: чужой скилл — чужое мнение о своём продукте, новая версия
      может быть регрессом. Задача — заставить посмотреть diff и решить. При --emit-event скрипт
      всегда возвращает 0: ненулевой код у планировщика означает «задача сломалась», а не «нашёл
      расхождение» — это разные события. Скрипт НЕ копируется в образ, а монтируется из /repo:
      иначе после правки контейнер выполнял бы старую версию. Клоны монтируются rw, потому что
      нужен git fetch; в образе включён safe.directory. Path-корни переопределяются
      SKILLPACKS_CLONE_ROOT / SKILLPACKS_STATE / SKILLPACKS_REPO. Контур — local-lab#199.

  - id: INFRA-021
    name: local-alerts
    criticality: P3
    role: >-
      состояние правил Grafana в интерфейсе Hermes — чип в статус-баре и панель со списком;
      отвечает на вопрос «что горит сейчас», почту не заменяет и правилами не управляет
    status: active
    kind: hermes-plugin
    location:
      package: E:/local-lab/infra/hermes/plugins/local-alerts
      installed: C:/Users/s.poklad/AppData/Local/hermes/plugins/local-alerts
      desktop_half: C:/Users/s.poklad/AppData/Local/hermes/plugins/local-alerts/desktop/plugin.js
      backend_route: /api/plugins/local-alerts/alerts
      upstream: /api/prometheus/grafana/api/v1/rules
    monitoring: >-
      собственных метрик нет; сам читает Grafana через серверную половину (токен в окружении,
      не в renderer). «Нет токена», «стек недоступен» и «бэкенд не смонтирован» показываются
      серым, а не зелёным: спокойный зелёный огонь над неизвестным состоянием — тот самый отказ,
      ради которого виджет и делается.
    check: python tools/contracts/check_hermes_plugin.py
    notes: >-
      Две половины одного пакета: dashboard/plugin_api.py монтируется в гейтвей и импортируется
      только при наличии плагина в plugins.enabled (config.yaml); desktop/plugin.js приложение
      читает само из plugins/<id>/desktop/ и включает тумблером в Capabilities → Plugins.
      Копию руками в desktop-plugins/ с самодельным .hermes-package.json не класть: маркер
      пишут установщик и reconcile-проход, чужой отбрасывается (файл исчезает, маркер остаётся).
      Пакет обязан иметь __init__.py с def register(ctx), иначе не регистрируется ни одна
      половина — проверять через `hermes plugins doctor local-alerts`. Renderer не
      может ходить в Grafana напрямую: CORS-заголовков нет, preflight отдаёт 401. Токен —
      service account с ролью Viewer; существующий GRAFANA_API_TOKEN на alerting API даёт 401.
      Контур — local-lab#194; ловушки и проверки — docs/reference/hermes/desktop-plugins.md.

# Стенды для тестов и экспериментов. Порядок = приоритет: сначала LAB-001.
# Признак продового/тестового — RULE-009 в infrastructure.md.
test_stands:
  - id: LAB-001
    name: pve
    criticality: T
    role: изолированные LXC и VM для экспериментов, которые влезают в память
    host: "pve.lab / 10.67.163.198 (host=pve-t490)"
    capacity: "7.48 GiB RAM, swap 4 GiB (/swapfile), ThinkPad T490"
    constraints: >-
      Слабый CPU. /tmp здесь это tmpfs в RAM размером 3.8 GiB, архивы образов и
      моделей класть только на диск. 30 октября 2026 в /tmp накопилось 3,8 ГБ
      остатков, свободная память упала до 2 ГБ и OOM выглядел как нехватка RAM.
      При разборе OOM проверять /tmp и Shmem, а не только RSS процессов. Требует,
      чтобы ноут был загружен в PVE (dual-boot с Windows). ICMP закрыт, ping не
      отвечает при живом сервере. DNS для LXC задавать явно nameserver 10.10.10.2
      (dnsmasq на vpn-gw): Proxmox иначе наследует резолвер узла 10.67.163.5,
      который внутри контейнера не отвечает. Правка конфига не обновляет живой
      /etc/resolv.conf, нужен перезапуск контейнера, затем проверка getent hosts.
    priority: 1
    monitoring: "Grafana Cloud, job=integrations/unix, host=pve-t490; дашборд /d/pve-t490-host"
    check: "curl -sk https://10.67.163.198:8006/ (ожидается 200); ssh pve pct list — по ключу из ~/.ssh/config, не по паролю"
    docs: docs/reference/pve.md
    notes: Предпочтителен по умолчанию. Продовую работу не затрагивает.

  - id: LAB-002
    name: local-docker
    criticality: T
    role: контейнеры на основном ноутбуке, когда нужен запас памяти или быстрый диск
    host: "SPOKLAD, Docker Desktop VM"
    capacity: "VM 3.83 GiB, хост 31.8 GiB / i5-10210U (4 ядра, 8 потоков), D: 32 GiB свободно"
    constraints: >-
      Здесь же живут продовые сервисы: Hindsight (INFRA-001), docker-exporter
      (INFRA-004), socket-proxy (INFRA-003), бэкап. Тест не должен конкурировать
      за память, порты и диск.
    priority: 2
    monitoring: "Grafana Cloud — integrations/windows для хоста; контейнеры через docker-exporter (INFRA-004)"
    check: "docker info; docker ps"
    notes: >-
      Мощнее PVE, но близко к проду. Перед запуском проверить свободную память
      и что тест не публикует занятые порты.

  - id: LAB-003
    name: timeweb-cloud
    criticality: T
    role: платное облако для того, что не влезает ни в PVE, ни в локальный Docker
    host: "Timeweb Cloud"
    capacity: по тарифу
    constraints: Платно. Брать только когда LAB-001 и LAB-002 показали, что не влезают.
    priority: 3
    monitoring: "Постоянного нет. При поднятии стенда — стандартная интеграция Grafana Cloud, иначе стенд не считается поднятым"
    check: read-only листинг через Timeweb API
    notes: Последний вариант, не по умолчанию.

