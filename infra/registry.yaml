  - id: INFRA-017
    name: honcho-local-test
    criticality: P2
    role: провайдер памяти Hermes (тест) — deriver, embeddings и dialectic на локальном стеке
    status: active
    kind: docker-compose
    location:
      compose: C:/Users/s.poklad/.honcho/profiles/local-test/docker-compose.yml
      runtime_root: C:/Users/s.poklad/.honcho/profiles/local-test
      env_file: C:/Users/s.poklad/.honcho/profiles/local-test/.env
      ports: [8000, 5432, 6379]
      containers: [local-test-api-1, local-test-deriver-1, local-test-database-1, local-test-redis-1]
    monitoring: Grafana Cloud — prometheus.scrape "honcho_api" (job=honcho-api, instance=theseus-laptop, 30s) через prometheus.relabel "honcho_keep" в Alloy
    check: curl -fsS http://127.0.0.1:8000/health
    notes: >-
      Профиль local-test, ноутбук, не PVE. Deriver идёт через hermes-proxy
      (host.docker.internal:8645/v1 → api.deepinfra.com). Фактические модели заданы в .env,
      который перебивает config.toml (RULE-018): deriver = upstage/solar-mini4:free;
      в config.toml остаётся неактивный дефолт gpt-5.4-mini.
      Dream (deduction/induction) вынесен на BotHub напрямую:
      DREAM__*_MODEL_CONFIG__OVERRIDES__BASE_URL=https://openai.bothub.chat/v1,
      модель mistral-small-3.2-24b-instruct, WRITE_WINDOW_ITERATIONS=5. base_url и api_key
      задаются только внутри OVERRIDES: верхнеуровневые DREAM__*__BASE_URL/__API_KEY
      принимаются молча и не применяются, из-за чего запрос уходит на общий прокси и
      упирается в 429 fair-share. Solar Mini на том же dream-контракте не вызывала
      create_observations и давала created_count=0.
      Fallback dream-моделей — gemini-2.5-flash через тот же BotHub (другое семейство,
      чтобы сбой mistral не сваливал обе модели). Failover проверен ломанием primary:
      404 MODEL_NOT_FOUND → switching to backup → run completed, created_count=4.
      Эмбеддинги — локальные, сервисом INFRA-018 (TEI, 384 измерения);
      прежняя внешняя text-embedding-3-small больше не используется.
      Метрики /metrics отдают ~337 серий, в Grafana уходит только очередь/эмбеддинги/
      dialectic/API. Контур — local-lab#177, cache-прайс провайдеров — #179.

