  hosted_room_policy_capacity:
    family: hosted_room_policy
    authority: placement_dependent_observed_state
    mirror: include_full_row
    canonical: defer
    replay: forbidden
    sensitivity: local_sensitive
    primary_key:
    - singleton
    rationale: Preserve checkpoint evidence but rebuild canonical state from authoritative room events.
  hosted_room_policy_cursors:
    family: hosted_room_policy
    authority: placement_dependent_observed_state
    mirror: include_full_row
    canonical: defer
    replay: forbidden
    sensitivity: local_sensitive
