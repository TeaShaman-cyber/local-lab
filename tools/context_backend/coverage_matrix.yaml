matrix_version: theseus.context.coverage-matrix.v1
source_kind: hermes-state-snapshot
source_schema_version: 33
scope: observed profile state.db shape from the inspected v0.23.3 schema-33 snapshot
authority_scope: profile snapshot evidence only; install shared-state.db requires a separate manifest
unknown_schema_policy: validator exits nonzero; observed validation remains a required manual gate until exporter integration
mirror_contract: include_full_row preserves every declared column verbatim in private local evidence
canonical_contract: canonical decisions never authorize replay of operational source state
hosted_room_contract: canonicalization is deferred until shared-state discovery and decoder contracts exist
known_lazy_or_shared_tables_absent_from_fixture:
- hosted_room_driver_executions
- hosted_room_replicas
- hosted_room_driver_results
- hosted_room_attachments
- hosted_room_router_claims
- hosted_room_gateway_handoffs
- hosted_room_legacy_imports
- telegram_dm_topic_roots
schema_objects:
  views:
  - messages_fts_src
  - messages_fts_trigram_src
  triggers:
  - messages_display_identity_delete
  - messages_display_identity_update
  - messages_display_order_insert
  - messages_display_revision_update
  - messages_display_visibility_update
  - messages_fts_delete
  - messages_fts_insert
  - messages_fts_trigram_delete
  - messages_fts_trigram_insert
  - messages_fts_trigram_update
  - messages_fts_update
  - messages_message_uid_insert
  - messages_transcript_revision_update
  - sessions_runtime_ledger_delete_guard
  indexes: derive_physical_and_constraints
tables:
  _litestream_lock:
    family: storage_mechanic
    authority: external_replication_mechanic
    mirror: exclude_mechanic
    canonical: exclude_mechanic
    replay: forbidden
    sensitivity: none
    primary_key: []
    rationale: Foreign Litestream bookkeeping is not Hermes logical state.
  _litestream_seq:
    family: storage_mechanic
    authority: external_replication_mechanic
    mirror: exclude_mechanic
    canonical: exclude_mechanic
    replay: forbidden
    sensitivity: none
    primary_key:
    - id
    rationale: Foreign Litestream bookkeeping is not Hermes logical state.
  async_delegations:
    family: delegation
    authority: durable_delegation_ledger
    mirror: include_full_row
    canonical: defer
    replay: forbidden
    sensitivity: local_sensitive
    primary_key:
    - delegation_id
    rationale: Delegation lifecycle, ownership and result evidence; opaque payloads remain local.
  compression_locks:
    family: runtime_coordination
    authority: transient_operational_state
    mirror: include_full_row
    canonical: exclude_transient
    replay: forbidden
    sensitivity: local_internal
    primary_key:
    - session_id
    rationale: Snapshot evidence only; PID, lease, heartbeat, retry or queue state must never be replayed.
  conversation_generations:
    family: conversation
    authority: operational_identity_ledger
    mirror: include_full_row
    canonical: include
    replay: forbidden
    sensitivity: local_internal
    primary_key:
    - source
    - session_key
    rationale: Never-pruned generation fence prevents ABA and must survive history reconstruction.
  delivery_obligations:
    family: runtime_coordination
    authority: sensitive_transient_operational_state
    mirror: include_full_row
    canonical: exclude_transient
    replay: forbidden
    sensitivity: local_sensitive
    primary_key:
    - obligation_id
    rationale: Snapshot evidence only; content and errors are sensitive, while queue state must never be replayed.
  gateway_heartbeats:
    family: runtime_coordination
    authority: transient_operational_state
    mirror: include_full_row
    canonical: exclude_transient
    replay: forbidden
    sensitivity: local_internal
    primary_key:
    - backend_id
    rationale: Snapshot evidence only; PID, lease, heartbeat, retry or queue state must never be replayed.
  gateway_hygiene_state:
    family: runtime_coordination
    authority: transient_operational_state
    mirror: include_full_row
    canonical: exclude_transient
    replay: forbidden
    sensitivity: local_internal
    primary_key:
    - session_key
    rationale: Snapshot evidence only; PID, lease, heartbeat, retry or queue state must never be replayed.
  gateway_routing:
    family: routing
    authority: source_specific_operational_state
    mirror: include_full_row
    canonical: exclude_source_specific
    replay: forbidden
    sensitivity: local_internal
    primary_key:
    - scope
    - session_key
    rationale: Preserve opaque Hermes routing evidence without treating it as portable runtime state.
  hosted_room_events:
    family: hosted_room
    authority: placement_dependent_observed_state
    mirror: include_full_row
    canonical: defer
    replay: forbidden
    sensitivity: local_sensitive
    primary_key:
    - room_id
    - seq
    rationale: Room definition and sequenced event history; payloads and members may be sensitive.
  hosted_room_links:
    family: hosted_room
    authority: placement_dependent_observed_state
    mirror: include_full_row
    canonical: defer
    replay: forbidden
    sensitivity: local_sensitive
    primary_key:
    - room_id
    - member_id
    rationale: Durable member links and grants; transport details remain local.
  hosted_room_owed_revokes:
    family: hosted_room
    authority: placement_dependent_observed_state
