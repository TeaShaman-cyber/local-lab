    rationale: Preserve potentially sensitive receipt/result namespaces; canonicalization waits for an executable key registry.
  system_prompts:
    family: prompt
    authority: authoritative_history
    mirror: include_full_row
    canonical: include_sensitive
    replay: forbidden
    sensitivity: local_sensitive
    primary_key:
    - hash
    rationale: Content-addressed prompt evidence; local-only because prompt bodies may contain secrets.
  worker_executions:
    family: execution
    authority: operational_ledger
    mirror: include_full_row
    canonical: defer
    replay: forbidden
    sensitivity: local_internal
    primary_key:
    - execution_id
    rationale: Durable worker execution identity, status, generation and sequence head.
  worker_receipts:
    family: execution
    authority: durable_receipt
    mirror: include_full_row
    canonical: defer
    replay: forbidden
    sensitivity: local_sensitive
    primary_key:
    - execution_id
    - sequence
    rationale: Sequenced mutation/result receipts; preserve as evidence and never replay side effects.
